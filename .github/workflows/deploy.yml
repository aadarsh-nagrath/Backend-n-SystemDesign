name: Deploy Notes Viewer to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'notes-viewer/**'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: notes-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: notes-viewer

      - name: Build static notes database
        run: npm run build
        working-directory: notes-viewer

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: notes-viewer/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
